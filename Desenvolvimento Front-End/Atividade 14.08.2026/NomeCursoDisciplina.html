<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 1</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body { 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background-color: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 50px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 600px;
            border: 2px solid #667eea;
        }
        
        h1 {
            color: #667eea;
            font-size: 2.8em;
            margin-bottom: 15px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }
        
        .descricao {
            color: #555;
            font-size: 1.1em;
            margin-bottom: 30px;
            font-style: italic;
        }
        
        .info-section {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            padding: 30px;
            border-radius: 15px;
            margin: 30px 0;
            border-left: 5px solid #764ba2;
        }
        
        .info-item {
            color: #333;
            font-size: 1.05em;
            line-height: 2.2;
            font-weight: 500;
        }
        
        .info-item strong {
            color: #667eea;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎓 Seja Bem-Vindo</h1>
        
        <p class="descricao">Esta é uma página com cor de fundo roxa e design moderno</p>
        
        <div class="info-section">
            <div class="info-item"><strong> Nome:</strong> Gabrielle Victoria Lima Martins</div>
            <div class="info-item"><strong> Curso:</strong> Ciência da Computação</div>
            <div class="info-item"><strong> Disciplina:</strong> Desenvolvimento Front-End</div>
        </div>
    </div>
</body>
</html>
