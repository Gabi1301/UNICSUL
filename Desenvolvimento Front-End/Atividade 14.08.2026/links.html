<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exemplo de Links</title>
</head>
<body>
<h1>Exemplo de Links em HTML</h1>
<!-- Link para outra página -->
<p><a href="https://www.google.com">Visite a Página</a></p>
<!-- Link para enviar um e-mail -->
<p><a href="mailto:exemplo@exemplo.com">Envie um e-mail para nós</a></p>
<!-- Link para um número de telefone -->
<p><a href="tel:+5511999999999">Ligue para nós</a></p>
<!-- Link para um arquivo local -->
<p><a href="documentos/exemplo.pdf" download>Baixe o PDF de Exemplo</a></p>
</body>
</html>
